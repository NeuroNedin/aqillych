name = "aqillych-crm"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Страница мини-аппа лежит в ./public и отдаётся статикой.
# Всё, чего там нет (/api/*, /tg/*), уходит в Worker.
[assets]
directory = "./public"

# Дайджест проверяется каждый час; конкретный час берётся
# из DIGEST_HOUR (по локальному времени, см. TZ_OFFSET).
[triggers]
crons = ["0 * * * *"]

[vars]
# Часовой пояс в минутах от UTC. 300 = UTC+5 (Ташкент).
# Влияет на то, что считается «сегодня» для просрочек и плана недели.
TZ_OFFSET = "300"
# Час утреннего напоминания по локальному времени, 0-23.
DIGEST_HOUR = "9"
# Адрес мини-аппа для кнопки «Открыть CRM». Обычно трогать не нужно:
# Worker запоминает свой адрес, когда Telegram присылает первое сообщение.
# Заполни, только если раздаёшь CRM со своего домена.
APP_URL = ""

# База D1, созданная в панели Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "crm"
database_id = "faa31bb7-8ea9-44d0-ac56-a37a431ef3c1"
